<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>THÌ...</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        body, html {
            width: 100%;
            height: 100%;
            height: 100dvh;
            min-height: -webkit-fill-available;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }

        /* Lớp cảm ứng trong suốt phủ toàn màn hình bắt mọi cú chạm/click */
        #tap-target {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            z-index: 50;
            cursor: pointer;
            touch-action: manipulation;
        }

        /* Container chứa chữ */
        #text-container {
            position: relative;
            z-index: 10;
            text-align: center;
            pointer-events: none;
        }

        .main-text {
            font-size: clamp(3.5rem, 16vw, 11rem);
            font-weight: 900;
            letter-spacing: 3px;
            display: inline-block;
            will-change: transform, opacity, filter;
        }

        /* Hướng dẫn mờ bên dưới */
        #hint {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.45);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            transition: opacity 0.5s ease;
            animation: pulseHint 2s infinite ease-in-out;
            z-index: 20;
            width: 90%;
            text-align: center;
        }

        @keyframes pulseHint {
            0%, 100% { opacity: 0.25; }
            50% { opacity: 0.75; }
        }

        /* ------------------------------------------------
           ANIMATION 1: Zoom từ xa vào, mờ ảo tỏa sáng (Cinematic Blur Reveal)
           ------------------------------------------------ */
        .anim-1 {
            color: #ffffff;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.8), 0 0 50px rgba(99, 102, 241, 0.6);
            animation: intro1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes intro1 {
            0% {
                opacity: 0;
                transform: scale(0.3) translateY(40px);
                filter: blur(25px);
            }
            70% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1.08) translateY(-5px);
            }
            100% {
                opacity: 1;
                filter: blur(0px);
                transform: scale(1) translateY(0);
            }
        }

        /* ------------------------------------------------
           ANIMATION 2: Bổ từ trên xuống rung chấn (Slam & Earthquake Bounce)
           ------------------------------------------------ */
        .anim-2 {
            color: #ff3366;
            text-shadow: 0 0 25px rgba(255, 51, 102, 0.9), 0 0 60px rgba(255, 0, 76, 0.6);
            animation: intro2 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, shake2 0.4s 0.35s ease-in-out;
        }

        @keyframes intro2 {
            0% {
                opacity: 0;
                transform: translateY(-200px) scale(1.8) rotate(-8deg);
            }
            60% {
                opacity: 1;
                transform: translateY(15px) scale(0.9) rotate(2deg);
            }
            100% {
                opacity: 1;
                transform: translateY(0) scale(1) rotate(0deg);
            }
        }

        @keyframes shake2 {
            0%, 100% { transform: translate(0, 0); }
            20% { transform: translate(-15px, 8px) rotate(-3deg); }
            40% { transform: translate(12px, -10px) rotate(3deg); }
            60% { transform: translate(-8px, -4px) rotate(-1deg); }
            80% { transform: translate(6px, 5px) rotate(1deg); }
        }

        /* ------------------------------------------------
           ANIMATION 3: Xoay lật 3D bùng nổ sắc màu (3D Flip & Shockwave)
           ------------------------------------------------ */
        .anim-3 {
            color: #00f2fe;
            text-shadow: 0 0 30px #00f2fe, 0 0 60px #4facfe, 3px 3px 0px #ff0055;
            animation: intro3 0.85s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            perspective: 800px;
        }

        @keyframes intro3 {
            0% {
                opacity: 0;
                transform: scale(0.1) rotateX(90deg) rotateY(-45deg);
                filter: brightness(3);
            }
            60% {
                opacity: 1;
                transform: scale(1.25) rotateX(-15deg) rotateY(10deg);
                filter: brightness(1.5);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotateX(0deg) rotateY(0deg);
                filter: brightness(1);
            }
        }

        /* ------------------------------------------------
           ANIMATION 4: Hồi hộp giật cục rung rẩy (Suspense Glitch & Tremor)
           ------------------------------------------------ */
        .anim-4 {
            color: #ffd700;
            text-shadow: -4px 0 #ff0055, 4px 0 #00ffff, 0 0 35px rgba(255, 215, 0, 0.8);
            animation: intro4 0.4s ease-out forwards, tremor 0.08s infinite alternate 0.3s;
        }

        @keyframes intro4 {
            0% {
                opacity: 0;
                transform: scale(3.5);
                filter: blur(10px);
            }
            50% {
                opacity: 0.9;
                transform: scale(0.85);
                filter: blur(0);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes tremor {
            0% { transform: translate(-3px, 2px) skewX(2deg); }
            50% { transform: translate(3px, -2px) skewX(-2deg); }
            100% { transform: translate(-2px, -3px) skewX(0deg); }
        }

        /* ------------------------------------------------
           Ảnh Full Màn Hình (HightCat.jpg)
           ------------------------------------------------ */
        #cat-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            object-fit: cover;
            z-index: 9999;
            display: none;
            opacity: 0;
            pointer-events: none;
        }

        #cat-screen.active {
            display: block;
            animation: catBurst 0.35s cubic-bezier(0.15, 0.9, 0.3, 1.2) forwards;
        }

        @keyframes catBurst {
            0% {
                opacity: 0;
                transform: scale(1.35);
                filter: contrast(2) brightness(1.5);
            }
            50% {
                opacity: 1;
                filter: contrast(1.2) brightness(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
                filter: none;
            }
        }

        /* Hiệu ứng chớp sáng màn hình khi hiện ảnh */
        #flash-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            background: white;
            z-index: 10000;
            opacity: 0;
            pointer-events: none;
        }

        #flash-overlay.flash {
            animation: flashAnim 0.4s ease-out forwards;
        }

        @keyframes flashAnim {
            0% { opacity: 0.9; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Lớp nhận diện chạm/click cho cả mobile và máy tính -->
    <div id="tap-target"></div>

    <div id="text-container">
        <h1 id="title" class="main-text anim-1">THÌ...</h1>
    </div>

    <div id="hint">Chạm vào màn hình để tiếp tục</div>

    <!-- Ảnh mèo HighCat full màn hình -->
    <img id="cat-screen" src="HightCat.jpg" alt="HightCat">
    <div id="flash-overlay"></div>

    <script>
        const steps = [
            { text: "THÌ...", anim: "anim-1" },
            { text: "THÌ...", anim: "anim-2" },
            { text: "THÌ...", anim: "anim-3" },
            { text: "TH...", anim: "anim-4", final: true }
        ];

        let currentStep = 0;
        let isLocked = false;
        let lastTapTime = 0;

        const title = document.getElementById('title');
        const hint = document.getElementById('hint');
        const catScreen = document.getElementById('cat-screen');
        const flashOverlay = document.getElementById('flash-overlay');
        const tapTarget = document.getElementById('tap-target');

        function triggerStep(stepIndex) {
            const data = steps[stepIndex];

            // Xóa animation cũ và ép tính toán lại reflow
            title.className = "main-text";
            void title.offsetWidth;

            // Đặt text và animation mới
            title.textContent = data.text;
            title.classList.add(data.anim);

            if (data.final) {
                isLocked = true;
                hint.style.opacity = '0';
                tapTarget.style.display = 'none';

                // Sau 1s hiện ảnh full màn hình
                setTimeout(() => {
                    flashOverlay.classList.add('flash');
                    catScreen.classList.add('active');
                }, 1000);
            }
        }

        // Hàm xử lý tương tác (hỗ trợ cả chạm mobile và chuột máy tính)
        function handleInteraction(e) {
            if (isLocked) return;

            // Ngăn chặn kích hoạt kép giữa pointerdown/touchstart và click
            const now = Date.now();
            if (now - lastTapTime < 300) return;
            lastTapTime = now;

            if (e && e.cancelable && e.type !== 'pointerdown') {
                e.preventDefault();
            }

            currentStep++;
            if (currentStep < steps.length) {
                triggerStep(currentStep);
            }
        }

        // Bắt mọi loại sự kiện chạm trên mobile và click trên máy tính
        tapTarget.addEventListener('pointerdown', handleInteraction);
        tapTarget.addEventListener('touchstart', handleInteraction, { passive: false });
        tapTarget.addEventListener('click', handleInteraction);
        window.addEventListener('click', handleInteraction);
    </script>
</body>
</html>
